# This workflow will scan through the github repo and find any secret api keys that may have been committed to the repo.
# If any are found, it will create a pull request to remove them. It will also find any outdated dependencies and create a pull request to update them.
#
# To use this workflow, you will need to set up a .github/secret-deps.yml
# file with configuration.

name: Secret and Dependency Scanner
on: [push, pull_request_target]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          package-manager: "npm_and_yarn"
          directory: "/"
          target-branch: "main"
          open-pull-requests-limit: 5
          commit-message: "Found a secret API key in the codebase"
          pull-request-title: "Remove secret API key from codebase"
          pull-request-body: "This PR removes the secret API key from the codebase."

      - uses: dependabot/fetch-metadata@v1
        id: fetch_metadata
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: dependabot/dependabot-core@v2
        with:
          package-manager: "npm_and_yarn"
          directory: "/"
          target-branch: "main"
          open-pull-requests-limit: 5
          commit-message: "Update dependencies"
          pull-request-title: "Update dependencies"
          pull-request-body: "This PR updates the dependencies to the latest versions."
